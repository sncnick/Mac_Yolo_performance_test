services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"    # RTSP
      - "8888:8888"    # HLS
      - "8889:8889"    # WebRTC
      - "1935:1935"    # RTMP
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

  app:
    build: .
    container_name: detection
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      - RTSP_HOST=mediamtx:8554
      - HTTP_PORT=8000
      - CONFIG_FILE=/app/data/sources_config.json
      # optional: FRAME_W, FRAME_H, IMGSZ, MODEL, CLASSES
    ports:
      - "8000:8000"    # web UI / management
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # NOTE: 在 NVIDIA 伺服器上，可取消註解以下 GPU passthrough（僅 amd64 + CUDA）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
